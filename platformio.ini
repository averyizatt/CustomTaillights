; PlatformIO Project Configuration
; ESP32-S3 Custom Foxbody Taillight Controller
;
; One build: the custom PCB, headless. The lights are driven by the optocoupler
; inputs and the CAN bus only; no Wi-Fi, web page or OTA code is compiled or linked.
; It carries every recovery safeguard (README: "Recovery without the reset button").
;   pio run            compile
;   pio run -t upload  flash over USB

[platformio]
default_envs = esp32-s3-pcb

[env:esp32-s3-pcb]
; Pin the tested Arduino 3.3.8 / IDF 5.5.4 toolchain.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; Serial monitor
monitor_speed = 115200

; Libraries
lib_deps =
    fastled/FastLED @ 3.10.3
    autowp/autowp-mcp2515 @ ^1.3.1
    bblanchon/ArduinoJson @ ^7.0.0

; The Wi-Fi settings page and OTA sources stay in the repository but are not built.
build_src_filter =
    +<*>
    -<wifi_server.cpp>
    -<firmware_update.cpp>

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Arduino 3.x's GPIO/RGB support links the new RMT driver. Mixing it with
    ; legacy RMT aborts before setup(), so FastLED must use the same driver.
    -DFASTLED_RMT5=1

    -DCUSTOM_TAILLIGHTS_PCB=1
    -DTAILLIGHT_HEADLESS=1
