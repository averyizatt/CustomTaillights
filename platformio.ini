; PlatformIO Project Configuration
; ESP32-S3 Custom Foxbody Taillight Controller

[platformio]
default_envs = esp32-s3-pcb

[env:esp32-s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/wifi_include.py

; Serial monitor
monitor_speed = 115200

; Libraries
lib_deps =
    fastled/FastLED @ 3.10.3
    autowp/autowp-mcp2515 @ ^1.3.1
    bblanchon/ArduinoJson @ ^7.0.0

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Use FastLED's synchronous RMT driver with double-buffered refill.
    ; RMT5 in 3.10.3 uses asynchronous, single-block, non-DMA output on S3.
    -DFASTLED_RMT5=0
    -DFASTLED_RMT_MEM_BLOCKS=2

; Custom PCB build.  Uses the same firmware and hardware features with the
; PCB connector/net pinout selected in config.h.
[env:esp32-s3-pcb]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    -DCUSTOM_TAILLIGHTS_PCB=1

[env:native]
platform = native
test_build_src = no
